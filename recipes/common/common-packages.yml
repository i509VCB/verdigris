# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  # System packages we will always need
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Local network discovery
        - avahi
        # Allow TPM to unlock from LUKs
        - clevis
        - distrobox
        # core dumps for ABRT
        - gdb
        - git
        # signing kernel/modules
        - sbsigntools

  - type: systemd
    system:
      enabled:
        - avahi-daemon.service
