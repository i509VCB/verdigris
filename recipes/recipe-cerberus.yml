# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: verdigris-cerberus
description: Cerberus

base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: 44

platforms:
  - linux/amd64
  - linux/arm64

modules:
  - from-file: common/common-packages.yml
  - from-file: common/kde.yml
  - from-file: common/firefox-policy.yml
  - from-file: common/yubico-auth.yml
  - type: os-release
    properties:
      ID: verdigris-cerberus
      ID_LIKE: fedora
      NAME: Verdigris
      PRETTY_NAME: Verdigris Cerberus
  - from-file: common/post-build.yml
