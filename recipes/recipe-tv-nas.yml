# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: verdigris-tv-nas
description: TV + NAS setup with ZFS

base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: 44

platforms:
  - linux/amd64

modules:
  - from-file: common/common-packages.yml
  - from-file: common/zfs-modules.yml
  - from-file: common/kde.yml
  - from-file: common/firefox-policy.yml
  - from-file: common/auth.yml
  # This is a server. Enable the watchdog to reset if it becomes unresponsive.
  - type: files
    files:
      - source: system/etc/systemd/system.conf.d/99-watchdog-tv-nas.conf
        destination: /etc/systemd/system.conf.d/99-watchdog.conf
  - type: os-release
    properties:
      ID: verdigris-tv-nas
      ID_LIKE: fedora
      NAME: Verdigris
      PRETTY_NAME: Verdigris TV NAS
  - from-file: common/post-build.yml
